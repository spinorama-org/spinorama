name: Spinorama Python

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    # Data access is enabled explicitly for trusted branches, never public PRs.
    if: github.event_name == 'push' && vars.ENABLE_PRIVATE_DATA_CI == 'true'

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
        token: ${{ secrets.MEASUREMENTS_READ_TOKEN }}
        persist-credentials: false
    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12.7"
    - name: Install dependencies
      run: |
        python -m venv .venv
        source .venv/bin/activate
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
    - name: Build native generators and test metadata
      run: |
        cargo build --locked --release -p spinorama-generate --bins
        target/release/generate-graph --metadata-dir datas/measurements --check-meta
        cargo test --locked -p spinorama-generate --test metadata_toml
    - name: Install optional Python reference extensions for parity tests
      run: |
        source .venv/bin/activate
        make python-reference
    - name: Test with pytest
      run: |
        PYTHONPATH=.:./src:./src/spinorama:./src/website:./scripts .venv/bin/python -m pytest tests

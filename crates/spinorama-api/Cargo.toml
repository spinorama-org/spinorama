[package]
name = "spinorama-api"
version.workspace = true
edition.workspace = true
publish = false
description = "Low-resource Rust replacement for the spinorama FastAPI/Gunicorn API server"

# Member of the spinorama workspace (see the root Cargo.toml);
# dependency versions are inherited from [workspace.dependencies].

[[bin]]
name = "spinorama-api"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
hmac.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true

[dev-dependencies]
serde_json.workspace = true

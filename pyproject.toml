[build-system]
requires = ["setuptools", "wheel"]

[project]
name = "spinorama"
version = "2.0.0"
description = "Database of speaker measurements"
dynamic = ["dependencies"]
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "GPL-3.0-or-later"
authors = [
    { name = "Pierre Aubert", email = "pierre@spinorama.org" },
]

[project.optional-dependencies]
dev = ["pytest>=8.3.4", "pytest-cov", "ruff"]
browser = ["selenium>=4.28.1"]
reference = ["cython", "maturin", "setuptools", "wheel", "kaleido>=1.0.0"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[project.urls]
Homepage = "https://www.spinorama.org"
API = "https://api.spinorama.org"
Documentation = "https://www.spinorama.org/docs/index.html"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = []

[tool.pyright]
include = [".", "src", "tests"]
ignore = ["book", "experimentals", "datas/measurements", "datas/eq", "datas/pictures"]
venvPath = './.venv'
typeCheckingMode = 'basic'
pythonVersion = "3.12"
pythonPlatform = "Linux"

[tool.flake8]
max-line-length = 100
exclude = [
    ".git",
    "__pycache__",
    "datas/measurements",
    "dist",
    "build"
]
extend-ignore = [
    "E203"
]

[tool.ruff]
line-length = 100

lint.select = ["N", "YTT", "S", "B", "FBT", "EM", "ISC", "EXE", "G", "Q", "T20", "SIM", "PD", "PL", "TRY", "NPY", "RUF"]
lint.ignore = [
       "PLR",
       "T20",
       "ISC001",
       "FBT001",
       "FBT003"
]

# Allow autofix for all enabled rules (when `--fix`) is provided.
lint.fixable = ["N", "YTT", "S", "B", "FBT", "EM", "ISC", "EXE", "G", "Q", "T20", "SIM", "PD", "PL", "TRY", "NPY", "RUF"]
lint.unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101"]

[tool.sonar]
projectKey = "spinorama"
sources = "src"

[tool.pyrefly]
project-includes = [
    ".",
    "datas",
    "src",
    "tests",
]
python-platform = "linux"
python-version = "3.12.0"
infer-with-first-use = false

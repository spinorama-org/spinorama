# Bot protection: http-scope maps and rate-limit zones for spinorama vhosts.
# Designed for a tiny VPS: in-memory maps only, no lookups per request.
# Install in /etc/nginx/conf.d/ and include
# snippets/bot-protection-server.conf from each spinorama server block.

# Obvious automation / AI crawlers / scanners. Spoofable, and only the
# first layer: rate limits and the ban tool handle browser-faking clients.
map $http_user_agent $spin_bot_ua {
    default 0;
    "" 1;
    ~*(curl|wget|python-requests|python-httpx|aiohttp|scrapy|Go-http-client|Java/|libwww-perl|okhttp|node-fetch|axios|HeadlessChrome|PhantomJS|masscan|zgrab|GPTBot|ClaudeBot|CCBot|Amazonbot|Bytespider|PetalBot|SemrushBot|AhrefsBot|MJ12bot|DotBot|DataForSeoBot|serpstatbot|BLEXBot|Sogou|YandexBot|Baiduspider|Palo|CensysInspect|Shodan) 1;
}

# Vulnerability probes and other paths no legitimate visitor requests.
map $request_uri $spin_probe_path {
    default 0;
    ~*(wp-admin|wp-login|xmlrpc\.php|\.php(\?|$)|/\.env|cgi-bin|SDK/webLanguage|phpmyadmin|vendor/phpunit|/\.git/|/\.aws/|boaform|/actuator/) 1;
}

# Truncated client subnet, so rotating addresses inside one block share
# a rate budget: IPv4 /24, IPv6 first groups (/64-ish).
map $remote_addr $spin_subnet {
    ~^(?<octets>\d+\.\d+\.\d+)\.\d+$ $octets;
    ~^(?<prefix>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*): $prefix;
    default $remote_addr;
}

# Rate budgets. Baselines measured at 2 req/s average, 10 req/s bursts
# site-wide; per-IP limits sit far above one human page load and exist to
# stop harvesting, not browsing. Re-derive from analyze_access_log.py.
limit_req_zone $binary_remote_addr zone=spin_html:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=spin_graphs:10m rate=90r/m;
limit_req_zone $spin_subnet zone=spin_graphs_subnet:10m rate=300r/m;
limit_req_zone $binary_remote_addr zone=spin_meta:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=spin_compare:10m rate=60r/m;
# Anonymous API callers (no Authorization header) share a small budget;
# keyed clients are not counted here (per-key logging handles abuse).
map $http_authorization $spin_api_rate_key {
    "" $binary_remote_addr;
    default "";
}
limit_req_zone $spin_api_rate_key zone=spin_anonymous_api:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=spin_conn:10m;

# Compare renders are cached at the edge; the render service only sees
# cache misses.
proxy_cache_path /var/cache/nginx/spinorama-compare
    levels=1:2 keys_zone=spin_compare_cache:10m max_size=2g inactive=365d
    use_temp_path=off;

# Extended log format for bot analysis (analyze_access_log.py understands
# the standard combined prefix of this format).
log_format spinorama_bot '$remote_addr - $remote_user [$time_local] '
    '"$request" $status $body_bytes_sent "$http_referer" '
    '"$http_user_agent" bot_ua=$spin_bot_ua probe=$spin_probe_path '
    'limit=$limit_req_status cache=$upstream_cache_status';

# A page loads many modules, stylesheets, and icons concurrently. These
# public assets must not consume the HTML request budget on every navigation.
location ~ ^/(js|js3rd|css|pictures)/ {
    try_files $uri =404;
}

# Dev reloads the catalogue on each page. Use the browsing budget rather
# than the metadata harvesting limit (30 requests/minute, 10-request burst).
location ~ ^/json/ {
    limit_req zone=spin_html burst=60 nodelay;
    limit_req_status 429;
    try_files $uri =404;
}

# Dev images have stable URLs and change on each deployment.
location ~* ^/(speakers|headphones)/.*\.(webp|jpg|jpeg|png)$ {
    limit_req zone=spin_graphs burst=60 nodelay;
    limit_req zone=spin_graphs_subnet burst=120 nodelay;
    limit_req_status 429;
    expires off;
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
}

# Override the shared prefix locations without using their nginx cache.
location ~ ^/(compare-render|graph-render)/ {
    limit_req zone=spin_compare burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://unix:/home/spin/run/gunicorn.sock;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_cache off;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    expires off;
    add_header Cache-Control "no-store" always;
    add_header X-Compare-Edge-Cache "BYPASS" always;
}

# Applied at server scope, before location selection.
if ($uri ~* "(^|/)\.(git|hg|svn)(/|$)") {
    return 404;
}

# Only the owner-approved documentation template may be served as an archive.
# Its exact content is verified by check_public_dist.py before deployment.
if ($uri ~* "^(?!/docs/data/template Spinorama\.tar$).*\.(tar|tgz|tbz2|txz|7z|rar)(\.(gz|bz2|br|xz|zst))?$") {
    return 404;
}
if ($uri ~* "^/(speakers|headphones)/.*\.(json|csv)(\.(gz|bz2|zip|br|xz|zst))?$") {
    return 404;
}
if ($uri ~* "^/(speakers|headphones)/.*/traces/") {
    return 404;
}
if ($uri ~* "^/(speakers|headphones)/(?!.*/measurement-license\.txt$).*\.(txt|zip|gz|bz2|br|xz|zst)$") {
    return 404;
}
if ($uri ~* "^/docs/data/.*\.(zip|gz|bz2|br|xz|zst)$") {
    return 404;
}

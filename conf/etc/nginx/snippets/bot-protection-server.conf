# Server-scope bot protection for spinorama static vhosts.
# Requires conf.d/bot-protection.conf (maps + zones) and an existing
# /etc/nginx/snippets/spinorama-banned.conf (may be empty; maintained by
# scripts/ban_scrapers.py --apply).

include /etc/nginx/snippets/spinorama-banned.conf;

# Drop declared automation and vulnerability probes without a response.
if ($spin_bot_ua) {
    return 444;
}
if ($spin_probe_path) {
    return 444;
}

# Honeypots: never linked for humans, listed in robots.txt as disallowed.
# Any hit is logged separately and feeds ban_scrapers.py.
location = /trap-7f3a.html {
    access_log /var/log/nginx/spinorama-honeypot.log spinorama_bot;
    return 444;
}
location = /speakers/__honeypot__/CEA2034.json {
    access_log /var/log/nginx/spinorama-honeypot.log spinorama_bot;
    return 444;
}

# Numeric graph data is never public: the site serves pictures only.
location ~* ^/(speakers|headphones)/.*\.(json|csv)$ {
    return 404;
}
location ^~ /compare-cache/ {
    return 404;
}

# Graph pictures: hashed/immutable content at human browsing rates.
location ~* ^/(speakers|headphones)/.*\.(webp|jpg|jpeg|png)$ {
    limit_req zone=spin_graphs burst=60 nodelay;
    limit_req zone=spin_graphs_subnet burst=120 nodelay;
    limit_req_status 429;
    expires 365d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# The metadata index is public by design but rate-limited.
location /json/ {
    limit_req zone=spin_meta burst=10 nodelay;
    limit_req_status 429;
    try_files $uri =404;
}

# Lazy comparison pictures, rendered by the local compare service and
# cached by nginx. Budgeted per IP; the service adds its own caps.
location /compare-render/ {
    limit_req zone=spin_compare burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8765/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_cache spin_compare_cache;
    proxy_cache_key "$request_uri";
    proxy_cache_valid 200 365d;
    proxy_cache_valid 404 1m;
    proxy_cache_lock on;
    proxy_ignore_headers Set-Cookie;
    add_header X-Compare-Edge-Cache $upstream_cache_status;
}

location / {
    limit_req zone=spin_html burst=30 nodelay;
    limit_req_status 429;
    limit_conn spin_conn 20;
    try_files $uri $uri/ =404;
}

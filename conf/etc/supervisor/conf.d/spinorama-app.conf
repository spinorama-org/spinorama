[program:spinorama-api]
command=/home/spin/run/spin-api/spinorama-api-start.sh
user=spin
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/home/spin/log/api.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=14
umask=007
; Set the fingerprint secret here (keep it stable and private):
; environment=SPINORAMA_FINGERPRINT_SECRET="..."
